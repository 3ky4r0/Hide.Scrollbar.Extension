<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScrollHide - Favicon Extractor</title>
  <link rel="stylesheet" href="../../../assets/styles/tokens.css">
  <link rel="stylesheet" href="favicon.css">
</head>

<body>
  <header class="header-container">
    <div class="logo-link">
      <img id="headerFavicon" src="" alt="Favicon" class="logo" style="display: none;">
      <div id="headerFallback" class="logo fallback-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </div>
    </div>
    <div>
      <h1 style="margin-bottom: 4px;" data-i18n="faviconTitle">Favicon Extractor</h1>
      <p style="margin: 0; font-size: 14px; color: var(--muted);" data-i18n="faviconSubtitle">Extract and download high-resolution favicons from any website.</p>
    </div>
  </header>

  <main>
    <!-- Search / Input Bar -->
    <div class="input-group">
      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <input type="text" id="urlInput" class="text-input" placeholder="https://example.com/" data-i18n="faviconPlaceholder" autocomplete="off"
          spellcheck="false">
      </div>
      <button id="pasteBtn" class="btn btn-icon" title="Paste from clipboard" data-i18n-title="faviconPaste" aria-label="Paste" data-i18n-aria-label="faviconPaste">
        <svg class="inline-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
      </button>
      <button id="extractBtn" class="btn btn-icon btn-accent" title="Extract favicon" data-i18n-title="faviconExtract" aria-label="Extract" data-i18n-aria-label="faviconExtract">
        <svg class="inline-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>

    <div id="errorMsg" class="error-text" style="display: none;"></div>

    <!-- Results Section -->
    <div id="resultsContainer" class="results-section" style="display: none;">
      <div class="domain-info-card">
        <div id="siteHostTitle" class="domain-title">example.com</div>
      </div>

      <h2>
        <svg class="h2-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span data-i18n="faviconSelectFormat">Select size / format</span>
      </h2>

      <div class="fav-grid" id="favGrid">
        <!-- Injected items -->
      </div>

      <!-- Selected Details & Actions -->
      <div id="selectedActionsSection" class="selected-section" style="display: none;">
        <h2 style="font-size: 16px; margin-top: 20px; margin-bottom: 10px;">
          <svg class="h2-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
          <span data-i18n="faviconSelectedUrl">Selected URL</span>
        </h2>
        <div class="format-row">
          <input type="text" id="selectedUrlInput" class="text-input" readonly>
          <button id="copySelectedBtn" class="btn btn-icon" title="Copy URL" data-i18n-title="faviconCopyUrl" aria-label="Copy URL" data-i18n-aria-label="faviconCopyUrl">
            <svg class="inline-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
          <button id="openNewTabBtn" class="btn btn-icon" title="Open in new tab" data-i18n-title="faviconOpenTab" aria-label="Open in new tab" data-i18n-aria-label="faviconOpenTab">
            <svg class="inline-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </button>
          <button id="downloadBtn" class="btn btn-icon btn-accent" title="Download favicon" data-i18n-title="faviconDownload"
            aria-label="Download favicon" data-i18n-aria-label="faviconDownload">
            <svg class="inline-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Empty / Fallback State -->
    <div id="noFaviconNotice" class="note-box" style="display: none; text-align: center;" data-i18n="faviconNotFound">
      No valid favicon found for this website.
    </div>
  </main>

  <script src="../../shared/i18n.js"></script>
  <script src="favicon.js"></script>
</body>

</html>

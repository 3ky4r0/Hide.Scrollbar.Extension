<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScrollHide</title>
  <link rel="stylesheet" href="../../../assets/styles/tokens.css">
  <link rel="stylesheet" href="../../../assets/styles/popup.css">
</head>

<body>
  <div class="top-bar">
    <div id="domainDisplay" class="domain-display">loading...</div>
  </div>

  <div class="main-power-section">
    <button id="toggleScroll" class="power-btn" aria-label="Toggle hiding scrollbar" title="Toggle scrollbar">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
    </button>
    <div class="divider"></div>
    <div class="stats-section">
      <div class="stats-item">
        <span class="stats-label" data-i18n="statsStatus">Status</span>
        <span id="statusValue" class="stats-value">...</span>
      </div>
      <div class="stats-item">
        <span class="stats-label" data-i18n="statsExceptions">Exceptions</span>
        <span id="exceptionsCount" class="stats-value">0</span>
      </div>
      <div class="stats-item">
        <span class="stats-label" data-i18n="statsCleaned">Cleaned</span>
        <span id="cleanedCount" class="stats-value">0</span>
      </div>
    </div>
  </div>

  <div class="bottom-controls">
    <button id="addCurrentBtn" class="control-btn add-btn" title="Add site to whitelist" aria-label="Add site to whitelist" data-i18n-aria-label="addCurrentHost" data-i18n-title="addCurrentHost">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line id="addCurrentVertical" x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <button id="pickColorBtn" class="control-btn" title="Pick Color" aria-label="Pick Color" data-i18n-title="pickColor" data-i18n-aria-label="pickColor">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 22 1-1h3l9-9"></path>
        <path d="M3 21v-3l9-9"></path>
        <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"></path>
      </svg>
    </button>

    <button id="pageRulerBtn" class="control-btn" title="Page Ruler" aria-label="Page Ruler" data-i18n-title="pageRuler" data-i18n-aria-label="pageRuler">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 15v-3"></path>
        <path d="M14 15v-3"></path>
        <path d="M18 15v-3"></path>
        <path d="M2 8V4"></path>
        <path d="M22 6H2"></path>
        <path d="M22 8V4"></path>
        <path d="M6 15v-3"></path>
        <rect x="2" y="12" width="20" height="8" rx="1"></rect>
      </svg>
    </button>

    <button id="getFaviconBtn" class="control-btn" title="Get Favicon" aria-label="Get Favicon" data-i18n-title="getFavicon" data-i18n-aria-label="getFavicon">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
        <path d="M2 12h20"></path>
      </svg>
    </button>

    <button id="openSettingsBtn" class="control-btn" title="Settings" aria-label="Settings" data-i18n-aria-label="settings" data-i18n-title="settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
        </path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
  </div>

  <div id="restrictedNotice" class="restricted-notice" data-i18n="restrictedNotice">
    Extension can't work on this page
  </div>

  <div id="whitelistedNotice" class="whitelisted-notice" data-i18n="whitelistedNotice">
    This site is in the exception list
  </div>

  <script src="../../shared/i18n.js"></script>
  <script src="../../shared/constants.js"></script>
  <script src="../../shared/storage.js"></script>
  <script src="../../shared/browser-api.js"></script>
  <script src="../whitelist/whitelist-service.js"></script>
  <script src="popup.js"></script>
</body>

</html>
